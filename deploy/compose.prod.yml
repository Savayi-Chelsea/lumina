# Lumina production stack for a single server (AWS EC2).
#
#   cd deploy && docker compose -f compose.prod.yml up -d --build
#
# Settings and secrets come from deploy/.env (never committed; template:
# deploy/.env.production.example).
#
# Networking: the app containers use the host's network, so every process
# reaches Postgres, Kafka, Mailpit and the matching API on 127.0.0.1 exactly as
# in development (the Python workers refuse non-loopback database hosts by
# design). Infrastructure ports are bound to 127.0.0.1 only. The only public
# ports are Caddy's 80/443, and the AWS security group allows nothing else.
name: lumina

x-app: &app
  restart: unless-stopped
  network_mode: host
  env_file: .env
  depends_on:
    postgres: { condition: service_healthy }
    kafka: { condition: service_started }
    mailpit: { condition: service_started }

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    env_file: .env
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Password-reset and notification emails are captured here (not sent to the
  # internet). View the inbox through an SSM port-forward to 127.0.0.1:8025.
  mailpit:
    image: axllent/mailpit:v1.27.11
    restart: unless-stopped
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

  kafka:
    image: apache/kafka:4.1.0
    restart: unless-stopped
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xms256m -Xmx768m
    volumes:
      - kafka_data:/var/lib/kafka/data

  matching:
    <<: *app
    build: { context: .., dockerfile: deploy/Dockerfile.python }
    image: lumina-python
    volumes: [hf_cache:/hf-cache]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  events:
    <<: *app
    image: lumina-python
    command: ["python", "scripts/run_profile_events.py"]
    volumes: [hf_cache:/hf-cache]

  email:
    <<: *app
    image: lumina-python
    command: ["python", "scripts/run_notifications.py"]

  web:
    <<: *app
    build: { context: .., dockerfile: deploy/Dockerfile.web }
    image: lumina-web

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    network_mode: host
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]

volumes:
  postgres_data:
  kafka_data:
  hf_cache:
  caddy_data:
  caddy_config:
