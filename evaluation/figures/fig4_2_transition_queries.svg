<svg xmlns="http://www.w3.org/2000/svg" width="980" height="522" viewBox="0 0 980 522" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Where the systems differ: career-transition queries"><rect width="980" height="522" fill="#fcfcfb"/><text x="24.0" y="34.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600" >Where the systems differ: career-transition queries</text><text x="24.0" y="56.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="400" >Relevance depends on where a mentor works now, which the query rarely names. Dots offset vertically by system.</text><rect x="24.0" y="79.0" width="12" height="12" rx="3" fill="#2a78d6"/><text x="42.0" y="89.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" >Semantic (BGE + pgvector)</text><rect x="238.0" y="79.0" width="12" height="12" rx="3" fill="#eb6834"/><text x="256.0" y="89.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" >Keyword (TF-IDF)</text><rect x="387.2" y="79.0" width="12" height="12" rx="3" fill="#1baf7a"/><text x="405.2" y="89.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" >Hybrid (BGE + BM25)</text><line x1="490.0" x2="490.0" y1="104" y2="452" stroke="#c3c2b7" stroke-width="1"/><text x="490.0" y="470.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400" >0.00</text><line x1="605.0" x2="605.0" y1="104" y2="452" stroke="#e1e0d9" stroke-width="1"/><text x="605.0" y="470.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400" >0.25</text><line x1="720.0" x2="720.0" y1="104" y2="452" stroke="#e1e0d9" stroke-width="1"/><text x="720.0" y="470.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400" >0.50</text><line x1="835.0" x2="835.0" y1="104" y2="452" stroke="#e1e0d9" stroke-width="1"/><text x="835.0" y="470.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400" >0.75</text><line x1="950.0" x2="950.0" y1="104" y2="452" stroke="#e1e0d9" stroke-width="1"/><text x="950.0" y="470.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400" >1.00</text><text x="720.0" y="490.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400" >F1@5 for the query</text><text x="476.0" y="133.0" font-size="12" fill="#52514e" text-anchor="end" font-weight="400" >I&#x27;m a pilot who wants to teach new pilots for a living.</text><circle cx="687.1" cy="122.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><circle cx="555.7" cy="129.0" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><circle cx="621.4" cy="136.0" r="5" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><text x="476.0" y="167.0" font-size="12" fill="#52514e" text-anchor="end" font-weight="400" >I want to leave aviation and work in a bank.</text><circle cx="490.0" cy="156.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><circle cx="643.3" cy="163.0" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><circle cx="490.0" cy="170.0" r="5" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><text x="476.0" y="201.0" font-size="12" fill="#52514e" text-anchor="end" font-weight="400" >How do I move from airline work into hotels and resorts?</text><circle cx="843.8" cy="190.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><circle cx="631.5" cy="197.0" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><circle cx="773.1" cy="204.0" r="5" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><text x="476.0" y="235.0" font-size="12" fill="#52514e" text-anchor="end" font-weight="400" >I&#x27;m interested in protecting systems from hackers at a fintech company.</text><circle cx="752.9" cy="224.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><circle cx="621.4" cy="231.0" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><circle cx="752.9" cy="238.0" r="5" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><text x="476.0" y="269.0" font-size="12" fill="#52514e" text-anchor="end" font-weight="400" >I would like to train and coach people as my main job.</text><circle cx="709.0" cy="258.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><circle cx="709.0" cy="265.0" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><circle cx="709.0" cy="272.0" r="5" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><text x="476.0" y="303.0" font-size="12" fill="#52514e" text-anchor="end" font-weight="400" >Can I become an independent consultant after my airline career?</text><circle cx="654.3" cy="292.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><circle cx="621.4" cy="299.0" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><circle cx="654.3" cy="306.0" r="5" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><text x="476.0" y="337.0" font-size="12" fill="#52514e" text-anchor="end" font-weight="400" >I want to join a mobile network operator.</text><circle cx="674.0" cy="326.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><circle cx="490.0" cy="333.0" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><circle cx="674.0" cy="340.0" r="5" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><text x="476.0" y="371.0" font-size="12" fill="#52514e" text-anchor="end" font-weight="400" >I want to build data pipelines and work on analytics.</text><circle cx="643.3" cy="360.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><circle cx="720.0" cy="367.0" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><circle cx="643.3" cy="374.0" r="5" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><text x="476.0" y="405.0" font-size="12" fill="#52514e" text-anchor="end" font-weight="400" >What is it like to run quality and maintenance in a factory?</text><circle cx="898.9" cy="394.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><circle cx="694.4" cy="401.0" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><circle cx="796.7" cy="408.0" r="5" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><text x="476.0" y="439.0" font-size="12" fill="#52514e" text-anchor="end" font-weight="400" >Careers in the energy sector, for example geothermal power.</text><circle cx="766.0" cy="428.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><circle cx="858.0" cy="435.0" r="5" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><circle cx="858.0" cy="442.0" r="5" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/></svg>