<svg xmlns="http://www.w3.org/2000/svg" width="980" height="460" viewBox="0 0 980 460" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Search latency barely changes with corpus size"><rect width="980" height="460" fill="#fcfcfb"/><text x="24.0" y="34.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600" >Search latency barely changes with corpus size</text><text x="24.0" y="56.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="400" >Same 45 queries, same machine, sequential calls (semantic: 5 rounds, 225 calls per corpus)</text><rect x="24.0" y="79.0" width="12" height="12" rx="3" fill="#86b6ef"/><text x="42.0" y="89.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" >200 profiles (133 eligible mentors)</text><rect x="310.0" y="79.0" width="12" height="12" rx="3" fill="#1c5cab"/><text x="328.0" y="89.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400" >500 profiles (325 eligible mentors)</text><text x="70.0" y="122.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600" >Milliseconds</text><line x1="70.0" x2="946.0" y1="370.0" y2="370.0" stroke="#c3c2b7" stroke-width="1"/><text x="62.0" y="374.0" font-size="11" fill="#898781" text-anchor="end" font-weight="400" font-variant-numeric="tabular-nums">0 ms</text><line x1="70.0" x2="946.0" y1="324.0" y2="324.0" stroke="#e1e0d9" stroke-width="1"/><text x="62.0" y="328.0" font-size="11" fill="#898781" text-anchor="end" font-weight="400" font-variant-numeric="tabular-nums">25 ms</text><line x1="70.0" x2="946.0" y1="278.0" y2="278.0" stroke="#e1e0d9" stroke-width="1"/><text x="62.0" y="282.0" font-size="11" fill="#898781" text-anchor="end" font-weight="400" font-variant-numeric="tabular-nums">50 ms</text><line x1="70.0" x2="946.0" y1="232.0" y2="232.0" stroke="#e1e0d9" stroke-width="1"/><text x="62.0" y="236.0" font-size="11" fill="#898781" text-anchor="end" font-weight="400" font-variant-numeric="tabular-nums">75 ms</text><line x1="70.0" x2="946.0" y1="186.0" y2="186.0" stroke="#e1e0d9" stroke-width="1"/><text x="62.0" y="190.0" font-size="11" fill="#898781" text-anchor="end" font-weight="400" font-variant-numeric="tabular-nums">100 ms</text><line x1="70.0" x2="946.0" y1="140.0" y2="140.0" stroke="#e1e0d9" stroke-width="1"/><text x="62.0" y="144.0" font-size="11" fill="#898781" text-anchor="end" font-weight="400" font-variant-numeric="tabular-nums">125 ms</text><path d="M156.5,370.0 V211.2 Q156.5,207.2 160.5,207.2 H174.5 Q178.5,207.2 178.5,211.2 V370.0 Z" fill="#86b6ef"/><path d="M180.5,370.0 V206.6 Q180.5,202.6 184.5,202.6 H198.5 Q202.5,202.6 202.5,206.6 V370.0 Z" fill="#1c5cab"/><text x="179.5" y="388.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="400" >Semantic median</text><path d="M375.5,370.0 V171.6 Q375.5,167.6 379.5,167.6 H393.5 Q397.5,167.6 397.5,171.6 V370.0 Z" fill="#86b6ef"/><path d="M399.5,370.0 V169.4 Q399.5,165.4 403.5,165.4 H417.5 Q421.5,165.4 421.5,169.4 V370.0 Z" fill="#1c5cab"/><text x="398.5" y="388.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="400" >Semantic p95</text><path d="M594.5,370.0 V207.7 Q594.5,203.7 598.5,203.7 H612.5 Q616.5,203.7 616.5,207.7 V370.0 Z" fill="#86b6ef"/><path d="M618.5,370.0 V203.8 Q618.5,199.8 622.5,199.8 H636.5 Q640.5,199.8 640.5,203.8 V370.0 Z" fill="#1c5cab"/><text x="617.5" y="388.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="400" >Hybrid median</text><path d="M813.5,370.0 V175.1 Q813.5,171.1 817.5,171.1 H831.5 Q835.5,171.1 835.5,175.1 V370.0 Z" fill="#86b6ef"/><path d="M837.5,370.0 V170.1 Q837.5,166.1 841.5,166.1 H855.5 Q859.5,166.1 859.5,170.1 V370.0 Z" fill="#1c5cab"/><text x="836.5" y="388.0" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="400" >Hybrid p95</text><text x="24.0" y="424.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400" >Hybrid was timed once per answerable query (33 at 200, 45 at 500). Keyword (TF-IDF, in-process) took about 2 ms in both.</text><text x="24.0" y="442.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400" >2.4x more eligible mentors added about 2-3 ms, consistent with fixed per-query costs such as query encoding dominating.</text></svg>