<svg xmlns="http://www.w3.org/2000/svg" width="980" height="464" viewBox="0 0 980 464" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="How quickly profile changes reach mentor search"><rect width="980" height="464" fill="#fcfcfb"/><text x="24.0" y="34.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600" >How quickly profile changes reach mentor search</text><text x="24.0" y="56.0" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="400" >Event-driven re-indexing, end to end</text><line x1="330.0" x2="330.0" y1="94" y2="352" stroke="#c3c2b7" stroke-width="1"/><text x="330.0" y="370.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400" >0 s</text><line x1="425.0" x2="425.0" y1="94" y2="352" stroke="#e1e0d9" stroke-width="1"/><text x="425.0" y="370.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400" >2 s</text><line x1="520.0" x2="520.0" y1="94" y2="352" stroke="#e1e0d9" stroke-width="1"/><text x="520.0" y="370.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400" >4 s</text><line x1="615.0" x2="615.0" y1="94" y2="352" stroke="#e1e0d9" stroke-width="1"/><text x="615.0" y="370.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400" >6 s</text><line x1="710.0" x2="710.0" y1="94" y2="352" stroke="#e1e0d9" stroke-width="1"/><text x="710.0" y="370.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400" >8 s</text><line x1="805.0" x2="805.0" y1="94" y2="352" stroke="#e1e0d9" stroke-width="1"/><text x="805.0" y="370.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400" >10 s</text><line x1="900.0" x2="900.0" y1="94" y2="352" stroke="#e1e0d9" stroke-width="1"/><text x="900.0" y="370.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400" >12 s</text><text x="316.0" y="122.0" font-size="12" fill="#52514e" text-anchor="end" font-weight="400" >New profile (first event loads the model)</text><path d="M330.0,108.0 H711.8 Q715.8,108.0 715.8,112.0 V124.0 Q715.8,128.0 711.8,128.0 H330.0 Z" fill="#2a78d6"/><text x="723.8" y="122.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400" >8.1 s</text><text x="316.0" y="158.0" font-size="12" fill="#52514e" text-anchor="end" font-weight="400" >Profile updated</text><path d="M330.0,144.0 H358.6 Q362.6,144.0 362.6,148.0 V160.0 Q362.6,164.0 358.6,164.0 H330.0 Z" fill="#2a78d6"/><text x="370.6" y="158.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400" >0.7 s</text><text x="316.0" y="194.0" font-size="12" fill="#52514e" text-anchor="end" font-weight="400" >Update after a malformed event</text><path d="M330.0,180.0 H368.3 Q372.3,180.0 372.3,184.0 V196.0 Q372.3,200.0 368.3,200.0 H330.0 Z" fill="#2a78d6"/><text x="380.3" y="194.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400" >0.9 s</text><text x="316.0" y="230.0" font-size="12" fill="#52514e" text-anchor="end" font-weight="400" >Saved while Kafka was down (a)</text><path d="M330.0,216.0 H369.5 Q373.5,216.0 373.5,220.0 V232.0 Q373.5,236.0 369.5,236.0 H330.0 Z" fill="#2a78d6"/><text x="381.5" y="230.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400" >0.9 s</text><text x="316.0" y="266.0" font-size="12" fill="#52514e" text-anchor="end" font-weight="400" >Saved while the worker was stopped (b)</text><path d="M330.0,252.0 H664.3 Q668.3,252.0 668.3,256.0 V268.0 Q668.3,272.0 664.3,272.0 H330.0 Z" fill="#2a78d6"/><text x="676.3" y="266.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400" >7.1 s</text><text x="316.0" y="302.0" font-size="12" fill="#52514e" text-anchor="end" font-weight="400" >Worker started before Kafka (c)</text><path d="M330.0,288.0 H836.5 Q840.5,288.0 840.5,292.0 V304.0 Q840.5,308.0 836.5,308.0 H330.0 Z" fill="#2a78d6"/><text x="848.5" y="302.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400" >10.7 s</text><text x="316.0" y="338.0" font-size="12" fill="#52514e" text-anchor="end" font-weight="400" >Consent given again</text><path d="M330.0,324.0 H377.7 Q381.7,324.0 381.7,328.0 V340.0 Q381.7,344.0 377.7,344.0 H330.0 Z" fill="#2a78d6"/><text x="389.7" y="338.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400" >1.1 s</text><text x="24.0" y="410.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400" >Time from the change being saved until the mentor ranks first for its new topic in live search; one measured run each.</text><text x="24.0" y="428.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400" >(a) timed from the broker being reachable again.  (b) timed from the worker restarting; includes loading the model.</text><text x="24.0" y="446.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400" >(c) change saved after the broker returned; includes the worker&#x27;s reconnect back-off and model load.</text></svg>